<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Generator v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1117;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#1a1d27;border-bottom:1px solid #2d3148;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:#a78bfa}
header small{font-size:11px;color:#475569;background:#1e2235;padding:2px 8px;border-radius:12px}
main{display:flex;flex:1;overflow:hidden}
#sidebar{width:390px;flex-shrink:0;background:#13151f;border-right:1px solid #1e2235;display:flex;flex-direction:column;overflow:hidden}
#tpl-bar{padding:14px 14px 0;flex-shrink:0}
#tpl-bar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#tpl-bar h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin:0}
#tpl-toggle{background:none;border:1px solid #2d3148;color:#475569;font-size:10px;padding:3px 8px;border-radius:6px;cursor:pointer;transition:all .15s}
#tpl-toggle:hover{border-color:#7c3aed;color:#a78bfa}
#tpl-current{display:none;background:#1e1630;border:1.5px solid #7c3aed;border-radius:8px;padding:8px 11px;margin-bottom:8px;cursor:pointer}
#tpl-current-name{font-size:12px;font-weight:600;color:#e2e8f0}
#tpl-current-ind{font-size:10px;color:#7c3aed;margin-top:1px}
#tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl-card{background:#1a1d27;border:1.5px solid #2d3148;border-radius:8px;padding:9px 11px;cursor:pointer;transition:all .15s}
.tpl-card:hover{border-color:#7c3aed}
.tpl-card.active{border-color:#7c3aed;background:#1e1630}
.tpl-name{font-size:12px;font-weight:600;color:#e2e8f0}
.tpl-ind{font-size:10px;color:#475569;margin-top:1px}
#form-area{flex:1;overflow-y:auto;padding:14px}
#form-area::-webkit-scrollbar{width:3px}
#form-area::-webkit-scrollbar-thumb{background:#2d3148;border-radius:2px}
.fg{margin-bottom:18px}
.fg h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c3aed;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #1e2235}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:#94a3b8;margin-bottom:3px}
.field input[type=text],.field input[type=email],.field input[type=url],.field textarea,.field select{width:100%;background:#1a1d27;border:1px solid #2d3148;border-radius:6px;color:#e2e8f0;font-size:12px;padding:7px 9px;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#7c3aed}
.field textarea{resize:vertical;min-height:64px}
.crow{display:flex;gap:6px;align-items:center}
.crow input[type=color]{width:38px;height:34px;border:1px solid #2d3148;border-radius:6px;background:#1a1d27;cursor:pointer;padding:2px;flex-shrink:0}
.crow input[type=text]{flex:1}
.ip{display:flex;align-items:center;gap:7px}
.ip-btn{flex-shrink:0;background:#1e2235;border:1px solid #2d3148;color:#94a3b8;font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.ip-btn:hover{border-color:#7c3aed;color:#e2e8f0}
.ip-thumb{width:32px;height:32px;object-fit:cover;border-radius:4px;display:none}
.ip-name{font-size:10px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di{background:#1a1d27;border:1px solid #2d3148;border-radius:6px;padding:9px;margin-bottom:7px;position:relative}
.di input,.di textarea{background:#13151f}
.di-rm{position:absolute;top:7px;right:7px;background:none;border:none;color:#475569;cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.di-rm:hover{color:#ef4444}
.add-btn{background:none;border:1px dashed #2d3148;color:#475569;font-size:11px;padding:7px;border-radius:6px;cursor:pointer;width:100%;margin-top:3px}
.add-btn:hover{border-color:#7c3aed;color:#a78bfa}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gs{aspect-ratio:1;background:#1a1d27;border:1px dashed #2d3148;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative}
.gs:hover{border-color:#7c3aed}
.gs img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0}
.gs span{font-size:10px;color:#475569}
#gen-bar{padding:14px;border-top:1px solid #1e2235;flex-shrink:0}
#gen-btn{width:100%;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
#gen-btn:hover{opacity:.9}
#preview-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#preview-bar{background:#13151f;border-bottom:1px solid #1e2235;padding:0 14px;height:38px;display:flex;align-items:center;flex-shrink:0}
#preview-bar span{font-size:11px;color:#475569}
#preview-iframe{flex:1;border:none;background:#fff}
</style>
</head>
<body>
<header>
  <h1>Site Generator</h1>
  <small>Modular v2 — Add templates by extending TEMPLATES</small>
</header>
<main>
<div id="sidebar">
  <div id="tpl-bar">
    <div id="tpl-bar-header">
      <h2>Template</h2>
      <button id="tpl-toggle" onclick="toggleTplGrid()">▲ Hide</button>
    </div>
    <div id="tpl-current" onclick="toggleTplGrid()">
      <div id="tpl-current-name">—</div>
      <div id="tpl-current-ind">click to change</div>
    </div>
    <div id="tpl-grid"></div>
  </div>
  <div id="form-area">
    <div class="fg" id="common-fields">
      <h3>Business Info</h3>
      <div class="field"><label>Business Name *</label><input type="text" id="f-name" placeholder="Sree Devi Cafe" oninput="livePreview()"></div>
      <div class="field"><label>Tagline</label><input type="text" id="f-tagline" placeholder="Authentic Kerala flavours since 1990" oninput="livePreview()"></div>
      <div class="field"><label>About</label><textarea id="f-about" rows="3" placeholder="Tell your story..." oninput="livePreview()"></textarea></div>
      <div class="field"><label>Phone / WhatsApp</label><input type="text" id="f-phone" placeholder="+91 98765 43210" oninput="livePreview()"></div>
      <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="hello@yourbusiness.com" oninput="livePreview()"></div>
      <div class="field"><label>Address</label><textarea id="f-address" rows="2" placeholder="Fort Kochi, Kerala" oninput="livePreview()"></textarea></div>
    </div>
    <div class="fg">
      <h3>Brand Colors</h3>
      <div class="field"><label>Primary</label><div class="crow"><input type="color" id="c-primary" value="#7c3aed" oninput="syncH('primary')"><input type="text" id="h-primary" value="#7c3aed" maxlength="7" oninput="syncC('primary')"></div></div>
      <div class="field"><label>Accent</label><div class="crow"><input type="color" id="c-accent" value="#f59e0b" oninput="syncH('accent')"><input type="text" id="h-accent" value="#f59e0b" maxlength="7" oninput="syncC('accent')"></div></div>
    </div>
    <div class="fg">
      <h3>Images</h3>
      <div class="field"><label>Logo (optional)</label><div class="ip"><button class="ip-btn" onclick="pickImg('logo')">Choose</button><img class="ip-thumb" id="thumb-logo"><span class="ip-name" id="iname-logo">No file</span></div></div>
      <div class="field"><label>Hero / Banner Image</label><div class="ip"><button class="ip-btn" onclick="pickImg('hero')">Choose</button><img class="ip-thumb" id="thumb-hero"><span class="ip-name" id="iname-hero">No file</span></div></div>
    </div>
    <div id="extra-fields"></div>
  </div>
  <div id="gen-bar">
    <button id="gen-btn" onclick="generate()">Generate Website</button>
  </div>
</div>
<div id="preview-panel">
  <div id="preview-bar"><span>Live Preview</span></div>
  <iframe id="preview-iframe" srcdoc="<p style='font:14px sans-serif;color:#999;padding:40px;text-align:center'>Select a template to begin</p>"></iframe>
</div>
</main>

<script>
// ─── Utilities ────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const v = id => (document.getElementById(id)||{}).value||'';
const wa = phone => { const n=(phone||'').replace(/\D/g,''); return n?`https://wa.me/${n}`:''; };
const safe = u => u&&!/^https?:\/\//i.test(u)?'https://'+u:u;

// ─── Image store ──────────────────────────────────────────────────────────────
const IMG = {};

function pickImg(key) {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(IMG[key]?.url) URL.revokeObjectURL(IMG[key].url);
    IMG[key] = {file:f, url:URL.createObjectURL(f), name:f.name};
    const th=document.getElementById('thumb-'+key), nm=document.getElementById('iname-'+key);
    if(th){th.src=IMG[key].url;th.style.display='block';}
    if(nm) nm.textContent=f.name;
    livePreview();
  };
  inp.click();
}

function initGal(id, keys) {
  const c=document.getElementById(id); if(!c) return; c.innerHTML='';
  keys.forEach(key=>{
    const s=document.createElement('div'); s.className='gs'; s.dataset.key=key;
    s.innerHTML=`<img id="thumb-${key}"><span>+</span>`;
    s.onclick=()=>pickGal(key,s); c.appendChild(s);
  });
}

function pickGal(key,slot) {
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    if(IMG[key]?.url) URL.revokeObjectURL(IMG[key].url);
    IMG[key]={file:f,url:URL.createObjectURL(f),name:f.name};
    const img=slot.querySelector('img'); img.src=IMG[key].url; img.style.display='block';
    slot.querySelector('span').style.display='none';
    livePreview();
  }; inp.click();
}

// ─── Colors ───────────────────────────────────────────────────────────────────
function syncH(k){document.getElementById('h-'+k).value=document.getElementById('c-'+k).value;livePreview();}
function syncC(k){const h=document.getElementById('h-'+k).value;if(/^#[0-9a-fA-F]{6}$/.test(h))document.getElementById('c-'+k).value=h;livePreview();}
function setColors(p,a){
  ['c-primary','h-primary'].forEach(id=>document.getElementById(id).value=p);
  ['c-accent','h-accent'].forEach(id=>document.getElementById(id).value=a);
}

// ─── Dynamic lists ────────────────────────────────────────────────────────────
function addItem(listId, innerHtml) {
  const c=document.getElementById(listId);
  const d=document.createElement('div'); d.className='di';
  d.innerHTML=`<button class="di-rm" onclick="this.parentElement.remove();livePreview()" title="Remove">&times;</button>${innerHtml}`;
  c.appendChild(d); livePreview();
}

function getItems(listId, fields) {
  return [...document.querySelectorAll(`#${listId} .di`)].map(el=>{
    const o={};
    fields.forEach(f=>{const x=el.querySelector(`[data-f="${f}"]`);o[f]=x?x.value:'';});
    return o;
  });
}

// ─── Common data ──────────────────────────────────────────────────────────────
function common() {
  return {name:v('f-name'),tagline:v('f-tagline'),about:v('f-about'),
    phone:v('f-phone'),email:v('f-email'),address:v('f-address'),
    primary:v('h-primary')||'#7c3aed',accent:v('h-accent')||'#f59e0b'};
}

// ─── Shared generated-site CSS ────────────────────────────────────────────────
function baseCSS(p,a,opts={}) {
  const bg=opts.bg||'#fff', surf=opts.surf||'#f8f9fa', textCol=opts.text||'#1a1a2e';
  return `*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:${p};--a:${a};--text:${textCol};--muted:#64748b;--bg:${bg};--surf:${surf}}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);line-height:1.65}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid rgba(0,0,0,.08);backdrop-filter:blur(8px)}
.ni{display:flex;align-items:center;justify-content:space-between;height:62px}
.nl{font-size:18px;font-weight:800;color:var(--p)}
.nm{display:flex;gap:26px}
.nm a{font-size:14px;color:var(--muted);font-weight:500;transition:color .2s}
.nm a:hover{color:var(--p)}
.burger{display:none;background:none;border:none;cursor:pointer;padding:4px}
.burger span{display:block;width:22px;height:2px;background:var(--text);margin:5px 0;border-radius:2px}
section{padding:76px 0}
.alt{background:var(--surf)}
.sl{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--a);font-weight:700;margin-bottom:10px}
.st{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;margin-bottom:14px}
.ss{color:var(--muted);font-size:1rem;max-width:560px;margin-bottom:44px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{background:var(--bg);border:1px solid rgba(0,0,0,.07);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.1)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.cb{padding:18px}
.cb h3{font-size:16px;font-weight:700;margin-bottom:6px}
.cb p{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 26px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);opacity:.92}
.bp{background:var(--a);color:#fff}
.bo{background:transparent;border:2px solid rgba(255,255,255,.6);color:#fff}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px}
.ci{display:flex;align-items:flex-start;gap:12px}
.cion{width:42px;height:42px;border-radius:10px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ci h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.ci p{font-size:14px;font-weight:500}
footer{background:var(--text);color:rgba(255,255,255,.55);text-align:center;padding:22px;font-size:12px}
footer strong{color:rgba(255,255,255,.85)}
.wafab{position:fixed;bottom:22px;right:22px;width:54px;height:54px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,211,102,.4);z-index:999;transition:transform .2s}
.wafab:hover{transform:scale(1.1)}
.wafab svg{width:26px;height:26px;fill:#fff}
@media(max-width:640px){
  .nm{display:none;flex-direction:column;position:absolute;top:62px;left:0;right:0;background:var(--bg);border-bottom:1px solid rgba(0,0,0,.08);padding:14px 24px;gap:14px}
  .nm.open{display:flex}.burger{display:block}
  section{padding:52px 0}
}`;
}

function navJs(){return `document.querySelector('.burger').addEventListener('click',()=>document.getElementById('nm').classList.toggle('open'));`;}

function wafab(phone){
  const lnk=wa(phone); if(!lnk) return '';
  return `<a class="wafab" href="${lnk}" target="_blank" rel="noopener" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.555 4.122 1.527 5.856L.057 23.405a.75.75 0 0 0 .924.924l5.549-1.47A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.737 9.737 0 0 1-4.96-1.357l-.355-.21-3.685.976.976-3.685-.21-.355A9.737 9.737 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg></a>`;
}

function heroSection(d, heroSrc, cta1, cta2='') {
  return `<section class="hero"><div class="wrap"><div class="hc">
    <h1>${esc(d.name)}</h1>
    ${d.tagline?`<p>${esc(d.tagline)}</p>`:''}
    <div class="hbtns">${cta1}${cta2}</div>
  </div></div>${heroSrc?`<img class="hbg" src="${heroSrc}" alt="">`:''}
  </section>`;
}

function contactSection(d, extra='') {
  return `<section id="contact" class="alt"><div class="wrap">
    <div class="sl">Find Us</div><h2 class="st">Contact</h2>
    <div class="cg">
      ${d.address?`<div class="ci"><div class="cion">📍</div><div><h4>Address</h4><p>${esc(d.address)}</p></div></div>`:''}
      ${d.phone?`<div class="ci"><div class="cion">📞</div><div><h4>Phone</h4><p>${esc(d.phone)}</p></div></div>`:''}
      ${d.email?`<div class="ci"><div class="cion">✉️</div><div><h4>Email</h4><p>${esc(d.email)}</p></div></div>`:''}
    </div>${extra}
  </div></section>`;
}

function navHtml(logoSrc, name, links) {
  const linkHtml = links.map(([href,label])=>`<a href="${href}">${label}</a>`).join('');
  return `<nav><div class="wrap"><div class="ni">
    <div class="nl">${logoSrc?`<img src="${logoSrc}" alt="logo" style="height:38px">`:`${esc(name)}`}</div>
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nm" id="nm">${linkHtml}</div>
  </div></div></nav>`;
}

function footerHtml(name) {
  return `<footer><p>&copy; ${new Date().getFullYear()} <strong>${esc(name)}</strong>. All rights reserved.</p></footer>`;
}

function wrap(title, css, body, phone, meta={}) {
  const desc  = meta.desc  || '';
  const hero  = meta.hero  || '';
  const addr  = meta.addr  || '';
  const schema = meta.schema ? `<script type="application/ld+json">${JSON.stringify(meta.schema)}<\/script>` : '';
  const ogImg  = hero ? `<meta property="og:image" content="${esc(hero)}">` : '';
  return `<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
${desc?`<meta name="description" content="${esc(desc)}">`:'' }
<meta property="og:type" content="website">
<meta property="og:title" content="${esc(title)}">
${desc?`<meta property="og:description" content="${esc(desc)}">`:'' }
${ogImg}
<meta name="robots" content="index, follow">
${schema}
<style>${css}</style>
</head><body>${body}${wafab(phone)}<script>${navJs()}<\/script></body></html>`;
}

// ─── TEMPLATES ────────────────────────────────────────────────────────────────
// To add a new template: create TEMPLATES.yourId = { id, label, industry, defaultColors, onSelect(), build(d,fp) }
// onSelect() injects HTML into #extra-fields and seeds default list items.
// build(d, forPreview) returns { 'index.html': '...', 'style.css': '...' }

const TEMPLATES = {};

// ══════════════════════════════════════════════════════════════════════════════
// RESTAURANT & CAFE
// ══════════════════════════════════════════════════════════════════════════════
TEMPLATES.restaurant = {
  id:'restaurant', label:'Restaurant & Café', industry:'Food & Dining',
  defaultColors:{primary:'#7b2d00',accent:'#c8860a'},
  onSelect() {
    setColors(this.defaultColors.primary, this.defaultColors.accent);
    document.getElementById('extra-fields').innerHTML = `
<div class="fg"><h3>Menu</h3><div id="menu-list"></div>
  <button class="add-btn" onclick="addMenuItem()">+ Add Category</button></div>
<div class="fg"><h3>Food Gallery</h3><div class="gg" id="gal-r"></div></div>
<div class="fg"><h3>Details</h3>
  <div class="field"><label>Opening Hours</label><input type="text" id="f-hours" placeholder="Mon–Sun 11am–10pm" oninput="livePreview()"></div>
  <div class="field"><label>Cuisine Type</label><input type="text" id="f-cuisine" placeholder="Kerala, North Indian" oninput="livePreview()"></div>
  <div class="field"><label>Google Maps Embed URL</label><input type="url" id="f-maps" placeholder="https://maps.google.com/..." oninput="livePreview()"></div>
</div>`;
    initGal('gal-r',['rg1','rg2','rg3','rg4','rg5','rg6']);
    addMenuItem(); addMenuItem();
  },
  build(d,fp) {
    const menu = getItems('menu-list',['cat','items']);
    const gkeys = ['rg1','rg2','rg3','rg4','rg5','rg6'];

// ─── Generate ─────────────────────────────────────────────────────────────────
// ─── Image compression ────────────────────────────────────────────────────────
function compressImage(file, maxW, maxH, quality=0.85) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let {width:w, height:h} = img;
      if(w > maxW || h > maxH) {
        const ratio = Math.min(maxW/w, maxH/h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.src = url;
  });
}

function compressedName(original) {
  return original.replace(/\.[^.]+$/, '') + '.jpg';
}

// ─── Generate ─────────────────────────────────────────────────────────────────
async function generate() {
  if(!current){alert('Select a template first.');return;}
  const nm=v('f-name'); if(!nm){alert('Business Name is required.');return;}
  const d = common();
  const result = TEMPLATES[current].build(d, false);
  const ts = new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
  const folder = `${nm.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}-${ts}`;
  let root;
  try{root=await window.showDirectoryPicker({mode:'readwrite'});}catch{return;}
  const dir = await root.getDirectoryHandle(folder,{create:true});

  // write HTML/CSS files
  for(const[fn,content] of Object.entries(result)){
    const fh=await dir.getFileHandle(fn,{create:true});
    const w=await fh.createWritable(); await w.write(content); await w.close();
  }

  // compress and write images
  const heroKeys  = ['hero'];
  const logoKeys  = ['logo','profile'];
  const galKeys   = ['rg1','rg2','rg3','rg4','rg5','rg6',
    'wg1','wg2','wg3','wg4','wg5','wg6','pg1','pg2','pg3','pg4','pg5','pg6','pg7','pg8',
    'tg1','tg2','tg3','tg4','tg5','tg6','bg1','bg2','bg3','bg4','bg5','bg6',
    'fg1','fg2','fg3','fg4','fg5','fg6','den1','den2','den3','den4',
    'med1','med2','med3','med4','hot1','hot2','hot3','hot4','hot5','hot6',
    'wed1','wed2','wed3','wed4','wed5','wed6','sal1','sal2','sal3','sal4','sal5','sal6',
    'jew1','jew2','jew3','jew4','jew5','jew6','con1','con2','con3','con4','con5','con6',
    'int1','int2','int3','int4','int5','int6','cat1','cat2','cat3','cat4','cat5','cat6',
    're1','re2','re3','re4','re5','re6'];

  const compress = async (key, maxW, maxH) => {
    const img = IMG[key]; if(!img) return;
    try {
      const blob = await compressImage(img.file, maxW, maxH, 0.85);
      const name = compressedName(img.name);
      const fh = await dir.getFileHandle(name, {create:true});
      const w = await fh.createWritable(); await w.write(blob); await w.close();
    } catch{}
  };

  const btn = document.getElementById('gen-btn');
  btn.textContent = 'Compressing images…'; btn.disabled = true;

  for(const k of heroKeys)  await compress(k, 1920, 1080);
  for(const k of logoKeys)  await compress(k, 400,  400);
  for(const k of galKeys)   await compress(k, 1200, 900);

  btn.textContent = 'Generate Website'; btn.disabled = false;
  alert(`✅ Generated: ${folder}/\nImages compressed for fast loading.`);
}

  build(d,fp) {

.why-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}

    const stats = [proj&&['proj',proj,'Projects'],clients&&['cl',clients,'Clients'],yrs&&['yrs',yrs,'Years Exp.'],team&&['tm',team,'Team Size']].filter(Boolean);

          ${tech?`<div><div class="sl">Stack</div><h2 class="st">Tech We Use</h2><div class="tech-grid">${tech.split(',').map(t=>`<span class="tech-tag">${esc(t.trim())}</span>`).join('')}</div></div>`:''}
        </div></div></section>`:'')
      + (tests.filter(t=>t.quote).length?`<section id="clients"><div class="wrap"><div class="sl">Success Stories</div><h2 class="st">What Clients Say</h2><div class="g3">${tests.filter(t=>t.quote).map(t=>`<div class="it-rev"><p class="it-rev-q">"${esc(t.quote)}"</p><div class="it-rev-name">${esc(t.name)}</div>${t.sub?`<div class="it-rev-sub">${esc(t.sub)}</div>`:''}</div>`).join('')}</div></div></section>`:'')
      + (demoHref?`<div class="cta-band"><div class="wrap"><h2>Ready to Build Something Great?</h2><p>Let's discuss your project — free consultation, no commitment.</p><a href="${demoHref}" class="btn bp" target="_blank">Start a Conversation</a></div></div>`:'')
      + contactSection(d, linkedin?`<div style="margin-top:20px"><a href="${safe(linkedin)}" target="_blank" style="color:var(--a);font-weight:600">Connect on LinkedIn →</a></div>`:'')
      + footerHtml(d.name);
    const desc = [d.name, d.tagline, d.about, tech?`Tech: ${tech}`:'', d.address].filter(Boolean).join(' · ').slice(0,155);
    const schema = {"@context":"https://schema.org","@type":"ProfessionalService","name":d.name,"description":d.about||'',"telephone":d.phone||'',"address":{"@type":"PostalAddress","streetAddress":d.address||''},"url":""};
    return {'index.html':wrap(d.name,css,body,d.phone,{desc,hero:fp?IMG.hero?.url||'':IMG.hero?.name||'',schema}),'style.css':css};

};

.irev-sub{font-size:12px;color:var(--muted);margin-top:2px}`;
    const body = navHtml(logo,d.name,[svcs.filter(s=>s.name).length?['#services','Services']:null,galHtml?['#portfolio','Portfolio']:null,tests.filter(t=>t.quote).length?['#reviews','Reviews']:null,['#contact','Contact']].filter(Boolean))
      + heroSection(d,hero, bookHref?`<a href="${bookHref}" class="btn bp" target="_blank">Free Consultation</a>`:'', galHtml?`<a href="#portfolio" class="btn bo">View Portfolio</a>`:'')
      + `<section id="about" class="alt"><div class="wrap"><div class="g2" style="align-items:center;gap:48px">
          <div><div class="sl">About Us</div><h2 class="st">${esc(d.name)}</h2><p class="ss">${esc(d.about)}</p>
          ${insta?`<p style="margin-top:12px"><a href="https://instagram.com/${insta.replace('@','')}" target="_blank" style="color:var(--a);font-weight:600">${esc(insta)} on Instagram</a></p>`:''}
          <div class="stat-row">
            ${proj?`<div class="istat"><div class="istat-n">${esc(proj)}</div><div class="istat-l">Projects</div></div>`:''}
            ${yrs?`<div class="istat"><div class="istat-n">${esc(yrs)}</div><div class="istat-l">Years Exp.</div></div>`:''}
          </div></div>
          <div style="background:var(--bg);border-radius:14px;padding:28px">
            <p style="font-size:1.05rem;line-height:1.9;color:var(--p);font-style:italic">"Spaces that tell your story. Design that feels like home."</p>
          </div></div></div></section>`
      + (svcs.filter(s=>s.name).length?`<section id="services"><div class="wrap"><div class="sl">What We Offer</div><h2 class="st">Our Services</h2><div class="g3">${svcs.filter(s=>s.name).map(s=>`<div class="isvc"><h3>🏠 ${esc(s.name)}</h3>${s.desc?`<p>${esc(s.desc)}</p>`:''}</div>`).join('')}</div>${styles?`<div style="margin-top:36px"><div class="sl">Design Styles</div><div class="style-tags">${styles.split(',').map(s=>`<span class="style-tag">${esc(s.trim())}</span>`).join('')}</div></div>`:''}</div></section>`:'')
      + (galHtml?`<section id="portfolio" class="alt"><div class="wrap"><div class="sl">Our Work</div><h2 class="st">Portfolio</h2><div class="igal">${galHtml}</div></div></section>`:'')
      + (tests.filter(t=>t.quote).length?`<section id="reviews"><div class="wrap"><div class="sl">Happy Clients</div><h2 class="st">What They Say</h2><div class="g3">${tests.filter(t=>t.quote).map(t=>`<div class="irev"><p class="irev-q">"${esc(t.quote)}"</p><div class="irev-name">— ${esc(t.name)}</div>${t.sub?`<div class="irev-sub">${esc(t.sub)}</div>`:''}</div>`).join('')}</div></div></section>`:'')
      + contactSection(d, bookHref?`<div style="margin-top:28px;text-align:center"><a href="${bookHref}" class="btn bp" target="_blank">Book Free Consultation</a></div>`:'')
      + footerHtml(d.name);
    const desc = [d.name, styles, d.tagline, d.about, proj?`${proj} projects`:'', d.address].filter(Boolean).join(' · ').slice(0,155);
    const schema = {"@context":"https://schema.org","@type":"InteriorDesigner","name":d.name,"description":d.about||'',"telephone":d.phone||'',"address":{"@type":"PostalAddress","streetAddress":d.address||''},"url":""};
    return {'index.html':wrap(d.name,css,body,d.phone,{desc,hero:fp?IMG.hero?.url||'':IMG.hero?.name||'',schema}),'style.css':css};
  }
};

TEMPLATES.catering = {
  id:'catering', label:'Catering Services', industry:'Food & Events',
  defaultColors:{primary:'#7b2d00',accent:'#c8860a'},
  onSelect() {

  build(d,fp) {

    const cuisine=v('f-cuisine'), minOrd=v('f-min'), events=v('f-events'), areas=v('f-areas'), waNum=v('f-wa')||d.phone;
    const galHtml=gkeys.map((k,i)=>{const s=fp?(IMG[k]?.url||''):(IMG[k]?.name||'');return s?`<img src="${s}" alt="food ${i+1}" loading="lazy">`:''}).filter(Boolean).join('');
    const css = baseCSS(d.primary,d.accent,{bg:'#fdf9f5',surf:'#f5ece0'}) + `
.hero{min-height:88vh;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(150deg,${d.primary}ee,#4a1a00)}
.hbg{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.22}
.hc{position:relative;z-index:1;color:#fff;padding:80px 0}
.hc h1{font-size:clamp(2rem,4.5vw,3.6rem);font-weight:800;margin-bottom:14px}
.hc p{font-size:1.05rem;opacity:.88;max-width:520px;margin-bottom:28px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.info-strip{background:var(--a);color:#fff;padding:14px 0}
.info-strip .wrap{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;font-size:13px;font-weight:600}
.info-strip span{display:flex;align-items:center;gap:6px}
.cpkg{background:var(--bg);border:1px solid rgba(0,0,0,.08);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.cpkg:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.1)}
.cpkg-head{background:linear-gradient(135deg,${d.primary},#a04010);color:#fff;padding:20px}
.cpkg-head h3{font-size:18px;font-weight:700;margin-bottom:4px}
.cpkg-price{font-size:1.4rem;font-weight:800;color:var(--a)}
.cpkg-body{padding:20px}
.cpkg-body p{font-size:13px;color:var(--muted);line-height:1.7}
.cpkg-pax{font-size:12px;background:rgba(0,0,0,.06);display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:10px;color:var(--p);font-weight:600}
.cui-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cui-tag{background:var(--surf);color:var(--p);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600}
.cgal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cgal2 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.crev{background:var(--bg);border-left:4px solid var(--a);padding:20px;border-radius:0 10px 10px 0}
.crev p{font-size:14px;font-style:italic;color:#444;line-height:1.8;margin-bottom:10px}
.crev strong{font-size:13px;color:var(--p)}
.crev small{font-size:12px;color:var(--muted)}`;
    const body = navHtml(logo,d.name,[pkgs.filter(p=>p.name).length?['#packages','Packages']:null,cuisine?['#cuisine','Cuisine']:null,galHtml?['#gallery','Gallery']:null,['#contact','Book Now']].filter(Boolean))
      + heroSection(d,hero, waNum?`<a href="${wa(waNum)}" class="btn bp" target="_blank">Get a Quote on WhatsApp</a>`:'', `<a href="#packages" class="btn bo">View Packages</a>`)
      + ((minOrd||events||areas)?`<div class="info-strip"><div class="wrap">
          ${minOrd?`<span>👥 ${esc(minOrd)}</span>`:''}
          ${events?`<span>🎉 ${esc(events)}</span>`:''}
          ${areas?`<span>📍 ${esc(areas)}</span>`:''}
        </div></div>`:'')
      + `<section id="about" class="alt"><div class="wrap"><div class="g2" style="align-items:center;gap:40px">
          <div><div class="sl">About Us</div><h2 class="st">${esc(d.name)}</h2><p class="ss">${esc(d.about)}</p></div>
          <div style="background:var(--bg);border-radius:14px;padding:28px">
            <p style="font-size:1.05rem;line-height:1.9;color:var(--p);font-style:italic">"Great food. Flawless service. Memories that last."</p>
          </div></div></div></section>`
      + (pkgs.filter(p=>p.name).length?`<section id="packages"><div class="wrap"><div class="sl">Choose Your Menu</div><h2 class="st">Catering Packages</h2><div class="g3">${pkgs.filter(p=>p.name).map(p=>`<div class="cpkg"><div class="cpkg-head"><h3>${esc(p.name)}</h3>${p.price?`<div class="cpkg-price">${esc(p.price)}</div>`:''}</div><div class="cpkg-body">${p.pax?`<span class="cpkg-pax">👥 ${esc(p.pax)}</span>`:''} ${p.desc?`<p>${esc(p.desc)}</p>`:''} ${waNum?`<a href="${wa(waNum)}" class="btn bp" style="margin-top:14px;font-size:12px;padding:8px 18px;width:100%;justify-content:center" target="_blank">Book This</a>`:''}</div></div>`).join('')}</div></div></section>`:'')
      + (cuisine?`<section id="cuisine" class="alt"><div class="wrap"><div class="sl">What We Cook</div><h2 class="st">Cuisine Specialities</h2><div class="cui-tags">${cuisine.split(',').map(c=>`<span class="cui-tag">🍽 ${esc(c.trim())}</span>`).join('')}</div></div></section>`:'')
      + (galHtml?`<section id="gallery"><div class="wrap"><div class="sl">Fresh & Delicious</div><h2 class="st">Food Gallery</h2><div class="cgal2">${galHtml}</div></div></section>`:'')
      + (tests.filter(t=>t.quote).length?`<section class="alt"><div class="wrap"><div class="sl">Happy Clients</div><h2 class="st">Reviews</h2><div class="g2">${tests.filter(t=>t.quote).map(t=>`<div class="crev"><p>"${esc(t.quote)}"</p><strong>— ${esc(t.name)}</strong> ${t.sub?`<small> · ${esc(t.sub)}</small>`:''}</div>`).join('')}</div></div></section>`:'')
      + contactSection(d, waNum?`<div style="margin-top:28px;text-align:center"><a href="${wa(waNum)}" class="btn bp" target="_blank">WhatsApp for Booking</a></div>`:'')
      + footerHtml(d.name);
    const desc = [d.name, cuisine, d.tagline, d.about, minOrd, areas?`Serving: ${areas}`:'', d.address].filter(Boolean).join(' · ').slice(0,155);
    const schema = {"@context":"https://schema.org","@type":"FoodService","name":d.name,"description":d.about||'',"telephone":d.phone||'',"address":{"@type":"PostalAddress","streetAddress":d.address||''},"servesCuisine":cuisine||'',"url":""};
